name: Deploy Agent Cloud E2B Template

on:
  workflow_dispatch:
    inputs:
      e2b_access_token:
        description: 'E2B API key (leave blank to use the repo E2B_API_KEY secret). Access tokens are deprecated and rejected.'
        required: false
        type: string
      template_name:
        description: 'Template Name'
        required: true
        type: string
        default: 'pipilot-agent'
      cpu_count:
        description: 'CPU Cores (default: 2, Pro plan required for >2)'
        required: false
        type: string
        default: '2'
      memory_mb:
        description: 'Memory in MB (default: 4096, Pro plan required for >4096)'
        required: false
        type: string
        default: '4096'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install E2B CLI
      # @e2b/cli@latest + the v2 `template create` surface. E2B retired v1 server-side:
      # ACCESS_TOKEN is hard-rejected and 2.2.4's `template build` does not read E2B_API_KEY,
      # so this is the only path that still builds. Matches deploy-v4-template.yml.
      run: npm install -g @e2b/cli@latest

    - name: Build and deploy Agent Cloud E2B template
      run: |
        NAME="${{ inputs.template_name }}"; NAME="${NAME:-pipilot-agent}"
        CPU="$(printf '%s' "${{ inputs.cpu_count }}" | tr -cd '0-9')"; CPU="${CPU:-2}"
        MEM="$(printf '%s' "${{ inputs.memory_mb }}" | tr -cd '0-9')"; MEM="${MEM:-4096}"
        # Idempotent: drop any existing alias so a re-build never 403s on "alias already used".
        e2b template delete "$NAME" -y || true
        # The alias can take a moment to free up after the delete above, so a failed
        # create is retried once behind another delete rather than failing the run.
        sleep 5
        if ! e2b template create "$NAME" \
          --dockerfile e2b-agent-cloud.Dockerfile \
          --cpu-count "$CPU" \
          --memory-mb "$MEM"; then
          echo "Build failed — retrying once after another delete + wait (stale-alias propagation)..."
          e2b template delete "$NAME" -y || true
          sleep 10
          e2b template create "$NAME" --dockerfile e2b-agent-cloud.Dockerfile --cpu-count "$CPU" --memory-mb "$MEM"
        fi
      env:
        E2B_API_KEY: ${{ inputs.e2b_access_token || secrets.E2B_API_KEY }}

    - name: Display template info
      run: |
        echo "Template deployed successfully!"
        echo "Template name: ${{ inputs.template_name }}"
        echo "CPU cores: ${{ inputs.cpu_count }}"
        echo "Memory: ${{ inputs.memory_mb }}MB"
        echo ""
        echo "Features included:"
        echo "  - Claude Agent SDK (@anthropic-ai/claude-agent-sdk)"
        echo "  - Playwright with Chromium browser"
        echo "  - Node.js 20 runtime"
        echo "  - pnpm package manager"
        echo ""
        echo "Usage in code:"
        echo '  const sandbox = await Sandbox.create("${{ inputs.template_name }}", {'
        echo '    envs: {'
        echo '      ANTHROPIC_API_KEY: "your-api-key",'
        echo '      ANTHROPIC_BASE_URL: "optional-vercel-ai-gateway-url"'
        echo '    }'
        echo '  })'
