name: Deploy PiPilot Expo E2B Template

# Builds the `pipilot-expo` sandbox template: a COMPLETE Expo app installed with npm
# at /home/user/workspace that self-starts Metro on :8081 and publishes the exp:// URL
# to /tmp/expUrl. Scaffolded from e2b-expo-template/, which is PINNED to the same SDK
# and versions as the builder's own scaffold (frameworks.ts EXPO) — an SDK drift between
# the two is what previously made expo-router resolve across a major and break Metro.
on:
  workflow_dispatch:
    inputs:
      e2b_access_token:
        description: 'E2B API key (leave blank to use the repo E2B_API_KEY secret). Access tokens are deprecated and rejected.'
        required: false
        type: string
      template_name:
        description: 'Template Name'
        required: true
        type: string
        default: 'pipilot-expo'
      cpu_count:
        description: 'CPU Cores (Metro is heavy; 2 min, Pro plan for >2)'
        required: false
        type: string
        default: '2'
      memory_mb:
        description: 'Memory in MB (Metro is memory-hungry; 4096 min)'
        required: false
        type: string
        default: '4096'
  # Monthly rebuild picks up patch releases within the PINNED ranges in
  # e2b-expo-template/package.json. Bumping the SDK itself is a deliberate edit there,
  # made together with frameworks.ts EXPO — never a drift the schedule introduces.
  schedule:
    - cron: '0 6 1 * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install E2B CLI
      # @e2b/cli@latest + the v2 `template create` surface. E2B retired v1 server-side:
      # ACCESS_TOKEN is hard-rejected and 2.2.4's `template build` does not read E2B_API_KEY,
      # so this is the only path that still builds. Matches deploy-v4-template.yml.
      run: npm install -g @e2b/cli@latest

    - name: Build and deploy pipilot-expo E2B template
      run: |
        NAME="${{ inputs.template_name }}"; NAME="${NAME:-pipilot-expo}"
        CPU="$(printf '%s' "${{ inputs.cpu_count }}" | tr -cd '0-9')"; CPU="${CPU:-2}"
        MEM="$(printf '%s' "${{ inputs.memory_mb }}" | tr -cd '0-9')"; MEM="${MEM:-4096}"
        # Idempotent: drop any existing alias so a re-build never 403s.
        echo "Removing existing '$NAME' template (if any)..."
        e2b template delete "$NAME" -y || true
        echo "Building '$NAME' with ${CPU} vCPU / ${MEM} MB"
        # --cmd = the START COMMAND run on every sandbox boot (self-starts the Expo
        # dev server). --ready-cmd gates readiness on Metro's LOCAL web server (:8081)
        # responding - fast (~30-60s) and reliable. The exp:// tunnel is resolved in a
        # background loop inside expo-start.sh (slow/flaky external dep) and MUST NOT
        # gate readiness, else builds time out waiting on ngrok.
        # The alias can take a moment to free up after the delete above, so a failed
        # create is retried once behind another delete rather than failing the run.
        sleep 5
        if ! e2b template create "$NAME" \
          --dockerfile e2b-expo.Dockerfile \
          --cpu-count "$CPU" \
          --memory-mb "$MEM" \
          --cmd "/usr/local/bin/expo-start.sh" \
          --ready-cmd "curl -sf -o /dev/null http://localhost:8081/status"; then
          echo "Build failed — retrying once after another delete + wait (stale-alias propagation)..."
          e2b template delete "$NAME" -y || true
          sleep 10
          e2b template create "$NAME" --dockerfile e2b-expo.Dockerfile --cpu-count "$CPU" --memory-mb "$MEM" --cmd "/usr/local/bin/expo-start.sh" --ready-cmd "curl -sf -o /dev/null http://localhost:8081/status"
        fi
      env:
        # E2B_ACCESS_TOKEN is DEPRECATED and no longer accepted — it now 401s on every call
        # ("Invalid Access token"), which silently broke template rebuilds. E2B requires an API
        # key instead; the E2B_API_KEY repo secret already exists.
        # The other deploy-*-template workflows still carry the old variable and will fail the
        # same way until they are migrated too.
        E2B_API_KEY: ${{ inputs.e2b_access_token || secrets.E2B_API_KEY }}

    - name: Display template info
      run: |
        echo "pipilot-expo template deployed."
        echo "Self-starts: expo start --port 8081 (web + Expo Go via the E2B public host) → /tmp/expUrl"
        echo "Scaffold: e2b-expo-template/ (Expo SDK 54 + expo-router 6), npm-installed at /home/user/workspace"
        echo 'Usage: const sandbox = await Sandbox.create("pipilot-expo")  // server already up; read /tmp/expUrl'
