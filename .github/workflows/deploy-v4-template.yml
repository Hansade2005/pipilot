name: Deploy PiPilot v4 E2B Template

on:
  workflow_dispatch:
    inputs:
      e2b_api_key:
        description: 'E2B API Key (leave blank to use the repo E2B_API_KEY secret) — E2B_ACCESS_TOKEN is deprecated, the CLI now requires E2B_API_KEY'
        required: false
        type: string
      template_name:
        description: 'Template Name'
        required: true
        type: string
        default: 'pipilot-v4'
      cpu_count:
        description: 'CPU Cores (default: 2, Pro plan required for >2)'
        required: false
        type: string
        default: '2'
      memory_mb:
        description: 'Memory in MB (default: 4096, Pro plan required for >4096)'
        required: false
        type: string
        default: '4096'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install E2B CLI
      # Global + isolated: `pnpm add` at repo root pulls in the whole Next.js
      # project and pnpm v10 then exits non-zero on ignored build scripts
      # (sharp/oxide). npm -g sidesteps the project entirely.
      # @latest (was pinned to 2.2.4's deprecated v1 `template build --name
      # --dockerfile`): E2B retired the v1 auth/build path server-side (ACCESS_TOKEN
      # now hard-rejected, and 2.2.4's `build` subcommand doesn't even read
      # E2B_API_KEY) — the v2 CLI's `template create` is the only surface that
      # still works, and it reads E2B_API_KEY directly from the environment.
      run: npm install -g @e2b/cli@latest

    - name: Build and deploy PiPilot v4 E2B template
      run: |
        # Strip any non-digits (e.g. a "8,192" thousands separator) and default.
        NAME="${{ inputs.template_name }}"; NAME="${NAME:-pipilot-v4}"
        CPU="$(printf '%s' "${{ inputs.cpu_count }}" | tr -cd '0-9')"; CPU="${CPU:-2}"
        MEM="$(printf '%s' "${{ inputs.memory_mb }}" | tr -cd '0-9')"; MEM="${MEM:-4096}"
        # Idempotent: drop any existing alias first so a re-create never 403s with
        # "alias already used". The delete can take a moment to propagate
        # server-side, so retry once (with one more delete + a short wait) if the
        # create still sees the old alias.
        echo "Removing existing '$NAME' template (if any)..."
        e2b template delete "$NAME" -y || true
        sleep 5
        echo "Building '$NAME' with ${CPU} vCPU / ${MEM} MB"
        if ! e2b template create "$NAME" \
          --dockerfile e2b-v4.Dockerfile \
          --cpu-count "$CPU" \
          --memory-mb "$MEM"; then
          echo "Build failed — retrying once after another delete + wait (stale-alias propagation)..."
          e2b template delete "$NAME" -y || true
          sleep 10
          e2b template create "$NAME" \
            --dockerfile e2b-v4.Dockerfile \
            --cpu-count "$CPU" \
            --memory-mb "$MEM"
        fi
      env:
        E2B_API_KEY: ${{ inputs.e2b_api_key || secrets.E2B_API_KEY }}

    - name: Display template info
      run: |
        echo "PiPilot v4 template deployed: ${{ inputs.template_name }}"
        echo "CPU: ${{ inputs.cpu_count }}  Memory: ${{ inputs.memory_mb }}MB"
        echo ""
        echo "Included:"
        echo "  - Node 22 LTS + pnpm + git"
        echo "  - Deploy CLIs: wrangler, vercel, netlify, neonctl, gh, supabase, stripe"
        echo "  - Warm React 18 + Vite 5 + Tailwind v4 starter cache in /home/user/project"
        echo ""
        echo "Usage:"
        echo '  const sandbox = await Sandbox.create("${{ inputs.template_name }}")'
