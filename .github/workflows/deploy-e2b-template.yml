name: Deploy E2B Template
on:
  workflow_dispatch:
    inputs:
      e2b_access_token:
        description: 'E2B API key (leave blank to use the repo E2B_API_KEY secret). Access tokens are deprecated and rejected.'
        required: false
        type: string
      template_name:
        description: 'Template Name'
        required: true
        type: string
        default: 'pipilot'
      cpu_count:
        description: 'CPU Cores (default: 2, Pro plan required for >2)'
        required: false
        type: string
        default: '2'
      memory_mb:
        description: 'Memory in MB (default: 4096, Pro plan required for >4096)'
        required: false
        type: string
        default: '4096'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install E2B CLI
      # @e2b/cli@latest + the v2 `template create` surface. E2B retired v1 server-side:
      # ACCESS_TOKEN is hard-rejected and 2.2.4's `template build` does not read E2B_API_KEY,
      # so this is the only path that still builds. Matches deploy-v4-template.yml.
      run: npm install -g @e2b/cli@latest
    - name: Build and deploy E2B template
      run: |
        NAME="${{ inputs.template_name }}"; NAME="${NAME:-pipilot}"
        CPU="$(printf '%s' "${{ inputs.cpu_count }}" | tr -cd '0-9')"; CPU="${CPU:-2}"
        MEM="$(printf '%s' "${{ inputs.memory_mb }}" | tr -cd '0-9')"; MEM="${MEM:-4096}"
        # Idempotent: `e2b template delete <alias>` 404s in CLI v1 (it can't resolve
        # the alias), so resolve the 20-char template ID from the list and delete THAT
        # (then also try by name as a fallback) — else a rebuild 403s with "alias
        # already used" (the bug that broke the v4 rebuild). Same fix as the desktop wf.
        echo "Removing existing '$NAME' template (if any)..."
        TID="$(e2b template list 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | awk -v n="$NAME" '$0 ~ ("[[:space:]]" n "[[:space:]]") {for(i=1;i<=NF;i++) if($i ~ /^[a-z0-9]{20}$/){print $i; exit}}')"
        if [ -n "$TID" ]; then echo "Found id $TID for $NAME — deleting by id"; e2b template delete "$TID" -y || true; fi
        e2b template delete "$NAME" -y || true
        echo "Building '$NAME' from e2b.Dockerfile with ${CPU} vCPU / ${MEM} MB"
        # The alias can take a moment to free up after the delete above, so a failed
        # create is retried once behind another delete rather than failing the run.
        sleep 5
        if ! e2b template create "$NAME" \
          --dockerfile e2b.Dockerfile \
          --cpu-count "$CPU" \
          --memory-mb "$MEM"; then
          echo "Build failed — retrying once after another delete + wait (stale-alias propagation)..."
          e2b template delete "$NAME" -y || true
          sleep 10
          e2b template create "$NAME" --dockerfile e2b.Dockerfile --cpu-count "$CPU" --memory-mb "$MEM"
        fi
      env:
        E2B_API_KEY: ${{ inputs.e2b_access_token || secrets.E2B_API_KEY }}
