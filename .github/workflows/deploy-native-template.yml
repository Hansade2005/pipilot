name: Deploy PiPilot Native E2B Template

# Builds the pipilot-native E2B sandbox template (Native SDK authoring runtime).
# Mirrors deploy-v4-template.yml. Needs the repo E2B_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      e2b_access_token:
        description: 'E2B API key (leave blank to use the repo E2B_API_KEY secret). Access tokens are deprecated and rejected.'
        required: false
        type: string
      template_name:
        description: 'Template Name'
        required: true
        type: string
        default: 'pipilot-native'
      cpu_count:
        description: 'CPU Cores (default: 2, Pro plan required for >2)'
        required: false
        type: string
        default: '2'
      memory_mb:
        description: 'Memory in MB (default: 4096, Pro plan required for >4096)'
        required: false
        type: string
        default: '4096'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install E2B CLI
      # @e2b/cli@latest + the v2 `template create` surface. E2B retired v1 server-side:
      # ACCESS_TOKEN is hard-rejected and 2.2.4's `template build` does not read E2B_API_KEY,
      # so this is the only path that still builds. Matches deploy-v4-template.yml.
      run: npm install -g @e2b/cli@latest

    - name: Build and deploy PiPilot native E2B template
      run: |
        NAME="${{ inputs.template_name }}"; NAME="${NAME:-pipilot-native}"
        CPU="$(printf '%s' "${{ inputs.cpu_count }}" | tr -cd '0-9')"; CPU="${CPU:-2}"
        MEM="$(printf '%s' "${{ inputs.memory_mb }}" | tr -cd '0-9')"; MEM="${MEM:-4096}"
        echo "=== Existing templates (diagnostic — ownership under THIS token) ==="
        e2b template list || true
        echo "==================================================================="
        echo "Removing existing '$NAME' template by alias (if owned by this token)..."
        e2b template delete "$NAME" -y || true
        # Fallback: alias-delete 404s when the CLI can't map alias->id, yet the alias stays
        # reserved and the build then 403s "already used". Resolve the REAL Template ID from the
        # listing (STRIP ANSI colour codes first — else the id gets a "37m" escape prefix and its
        # own delete 404s) matching the EXACT name column, and delete by id.
        ID=$(e2b template list 2>/dev/null | perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' | awk -v n="$NAME" '$3==n {print $2; exit}')
        if [ -n "$ID" ]; then echo "Deleting by resolved id: $ID"; e2b template delete "$ID" -y || true; else echo "No owned template id resolved for alias $NAME"; fi
        echo "Building '$NAME' with ${CPU} vCPU / ${MEM} MB"
        # The alias can take a moment to free up after the delete above, so a failed
        # create is retried once behind another delete rather than failing the run.
        sleep 5
        if ! e2b template create "$NAME" \
          --dockerfile e2b-native.Dockerfile \
          --cpu-count "$CPU" \
          --memory-mb "$MEM"; then
          echo "Build failed — retrying once after another delete + wait (stale-alias propagation)..."
          e2b template delete "$NAME" -y || true
          sleep 10
          e2b template create "$NAME" --dockerfile e2b-native.Dockerfile --cpu-count "$CPU" --memory-mb "$MEM"
        fi
      env:
        E2B_API_KEY: ${{ inputs.e2b_access_token || secrets.E2B_API_KEY }}

    - name: Display template info
      run: |
        echo "PiPilot native template deployed: ${{ inputs.template_name }}"
        echo "Included: Ubuntu 24.04 + GTK4/WebKitGTK6 + Node 22 + @native-sdk/cli@0.5.4 + gh"
        echo "Warm: Zig 0.16 toolchain + counter starter prebuilt in /home/user/project"
        echo 'Usage: const sandbox = await Sandbox.create("pipilot-native")'
